# firepot configuration
# Parsed as key=value lines. Never sourced, so nothing here is executed.
# Lists accept commas or spaces. Lines starting with # are comments.

# systemd system units that must be active
services = ssh, cron

# systemd --user units that must be active (checked as the invoking user)
user_services =

# TCP ports that must be listening
ports = 22

# hosts that must answer a single ping
peers = 198.51.100.10, 198.51.100.11

# a hostname that must resolve (leave empty to skip)
dns = example.com

# mount points to check (empty = every local filesystem)
mounts =

# checks to run (empty = all) and checks to skip
checks =
skip = sessions

# remote hosts for --host mode (comma separated user@host entries)
hosts =
ssh_opts =
ssh_timeout = 10
ping_timeout = 1

# thresholds: load is load1 per core, the rest are percent used
warn_load = 1.0
crit_load = 2.0
warn_mem = 80
crit_mem = 95
warn_swap = 50
crit_swap = 90
warn_disk = 80
crit_disk = 90
warn_inodes = 80
crit_inodes = 90
warn_zombies = 5
crit_zombies = 50
