name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Validate tag matches script version
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          SCRIPT_VERSION="$(bin/firepot --version | awk '{print $2}')"
          if [ "$TAG_VERSION" != "$SCRIPT_VERSION" ]; then
            echo "Tag version $TAG_VERSION does not match script version $SCRIPT_VERSION"
            exit 1
          fi
      - run: shellcheck -S style bin/firepot scripts/setup.sh tests/run.sh
      - run: bash tests/run.sh
      - name: Package release artifact
        run: |
          mkdir -p dist
          cp bin/firepot dist/firepot
          (cd dist && sha256sum firepot > firepot.sha256)
          # Deprecated old-name copy for one release, so existing download
          # scripts keep working; it prints a deprecation note when run.
          cp bin/firepot dist/node-healthcheck
          (cd dist && sha256sum node-healthcheck > node-healthcheck.sha256)
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/*

  github-release:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: dist/*
          generate_release_notes: true
